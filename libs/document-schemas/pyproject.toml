[project]
name = "beyondforms-document-schemas"
version = "0.1.0"
description = "Shared document type schemas for BeyondForms extraction and validation"
requires-python = ">=3.13"
dependencies = [
    "pydantic",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beyondforms"]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
