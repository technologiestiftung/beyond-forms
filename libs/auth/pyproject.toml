[project]
name = "beyondforms-auth"
version = "0.2.0"
description = "Authentication and Authorization utilities for BeyondForms"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic~=2.14",
    "fastapi~=0.159.1",
    "pyjwt[crypto]~=2.15",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "pytest~=9.1",
    "pytest-asyncio~=1.4",
    "requests~=2.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beyondforms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
