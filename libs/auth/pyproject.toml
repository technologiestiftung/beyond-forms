[project]
name = "beyondforms-auth"
version = "0.1.0"
description = "Authentication and Authorization utilities for BeyondForms"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic",
    "fastapi",
    "pyjwt[crypto]",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beyondforms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
