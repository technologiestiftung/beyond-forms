name: Run Staging E2E Audit & Promote to Production

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI/CD Orchestrator"]
    branches: [main]
    types: [completed]

jobs:
  audit-and-promote:
    name: Run Staging E2E Audit & Promote to Production
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: services/wallet-frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: services/wallet-frontend

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: services/wallet-frontend

      - name: Execute Staging E2E Audit Tests
        env:
          PROD_TEST_BYPASS_KEY: ${{ secrets.PROD_TEST_BYPASS_KEY }}
        run: npx playwright test --config=playwright.remote.config.ts --project=chromium-mobile
        working-directory: services/wallet-frontend
