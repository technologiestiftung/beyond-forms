name: Run Staging E2E Audit & Promote to Production

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI/CD Orchestrator"]
    branches: [main]
    types: [completed]

jobs:
  audit-and-promote:
    name: Run Staging E2E Audit & Promote to Production
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: services/wallet-frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: services/wallet-frontend

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: services/wallet-frontend

      - name: Execute Staging E2E Audit Tests
        env:
          PROD_TEST_BYPASS_KEY: ${{ secrets.PROD_TEST_BYPASS_KEY }}
        run: npx playwright test --config=playwright.remote.config.ts
        working-directory: services/wallet-frontend

      - name: Promote Staging to Production
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Staging E2E Audit passed successfully! Promoting main branch to prod branch automatically..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch and checkout prod branch
          git checkout prod

          # Merge main into prod
          git merge origin/main --no-edit

          # Push back to origin prod
          git push origin prod

          # Trigger production workflows via GitHub CLI
          echo "Triggering production CI/CD Orchestrator workflow..."
          gh workflow run ci.yaml --ref prod

          echo "Triggering production Apply Database Migrations workflow..."
          gh workflow run run-migrations.yaml --ref prod
