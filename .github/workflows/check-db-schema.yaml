name: Check DB Schema Snapshot

on:
  pull_request:
    paths:
      - "services/orchestration-middleware-service/alembic/**"
      - "services/orchestration-middleware-service/src/models.py"
      - "libs/db-schema/index.ts"
      - "scripts/dump_db_schema.sh"
      - ".github/workflows/check-db-schema.yaml"
  workflow_dispatch:

jobs:
  check-db-schema:
    name: Verify libs/db-schema/index.ts is in sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Bootstrap local dev environment
        run: |
          chmod +x scripts/bootstrap.sh
          ./scripts/bootstrap.sh

      - name: Start postgres
        run: docker compose up -d --wait postgres

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: Apply migrations and check models are in sync
        working-directory: services/orchestration-middleware-service
        env:
          POSTGRES_HOST: localhost
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Regenerate the schema snapshot
        run: ./scripts/dump_db_schema.sh

      - name: Fail if libs/db-schema/index.ts is out of date
        run: |
          if ! git diff --exit-code -- libs/db-schema/index.ts; then
            echo "::error::libs/db-schema/index.ts is out of sync with the Alembic migrations. Run ./scripts/dump_db_schema.sh locally and commit the result."
            exit 1
          fi
