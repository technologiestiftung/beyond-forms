name: Production Regression Tests

on:
  schedule:
    - cron: "0 4 * * *" # Run daily at 4:00 AM UTC
  workflow_dispatch:
  workflow_run:
    workflows: ["CI/CD Orchestrator"]
    branches: [prod]
    types: [completed]

jobs:
  run-prod-tests:
    name: Run Production E2E Tests
    if: ${{ (github.event.workflow_run && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: services/wallet-frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: services/wallet-frontend

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: services/wallet-frontend

      - name: Run E2E Tests on Production
        env:
          PLAYWRIGHT_BASE_URL: https://prod.bf.citylab-berlin.org
          PROD_TEST_BYPASS_KEY: ${{ secrets.PROD_TEST_BYPASS_KEY }}
        run: npx playwright test --config=playwright.remote.config.ts
        working-directory: services/wallet-frontend
