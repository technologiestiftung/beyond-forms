[project]
name = "auth-service"
version = "0.1.0"
description = "A service to manage authentication via Authentik"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.162.0",
    "uvicorn~=0.54.0",
    "pydantic~=2.14",
    "pydantic-settings~=2.16",
    "python-dotenv~=1.2",
    "authentik-client>=2026.8.5",
    "beyondforms-auth",
    "requests~=2.34",
    "asyncpg~=0.32.0",
    "pyjwt[crypto]~=2.15",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
beyondforms-auth = { workspace = true }



[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest~=9.2",
    "pytest-asyncio~=1.4",
    "httpx~=0.28.1",
    "ruff~=0.17.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
