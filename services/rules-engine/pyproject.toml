[project]
name = "rules-engine"
version = "0.1.0"
description = "This is the validation rules engine of the application."
authors = [{ name = "Janina J. Renk", email = "jrenk@google.com" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beyondforms-document-schemas",
    "uvicorn~=0.54.0",
    "python-dotenv~=1.2",
    "pydantic~=2.14",
    "fastapi[standard]~=0.162.0",
    "loguru~=0.7.3",
    "json5~=0.17.3",
]


[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
beyondforms-document-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[dependency-groups]
dev = [
    "pre-commit~=4.7",
    "pytest~=9.2",
    "httpx~=0.28.1",
    "mock~=5.2",
    "mypy~=2.4",
    "ruff~=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
