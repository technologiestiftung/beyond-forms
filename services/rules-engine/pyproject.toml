[project]
name = "rules-engine"
version = "0.1.0"
description = "This is the validation rules engine of the application."
authors = [{ name = "Janina J. Renk", email = "jrenk@google.com" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beyondforms-document-schemas",
    "uvicorn",
    "python-dotenv",
    "pydantic",
    "fastapi[standard]",
    "loguru",
    "json5",
]


[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
beyondforms-document-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "httpx",
    "mock",
    "mypy",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
