[project]
name = "forms-filling-service"
version = "0.1.0"
description = "Service for parsing and filling PDF forms."
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]~=0.162.0",
    "pydantic~=2.14",
    "pydantic-settings~=2.16",
    "pdfrw~=0.4.0",
    "reportlab~=5.1",
    "python-multipart~=0.0.33",
    "pymupdf~=2.1",
]

[tool.uv]
managed = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "pytest~=9.2",
    "httpx~=0.28.1",
    "pytest-asyncio~=1.4",
]
