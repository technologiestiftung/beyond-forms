steps:
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "${_SERVICE_NAME}"
      - "--image=${_IMAGE_URI}"
      - "--region=${_GCP_REGION}"
      - "--platform=managed"
      - "--no-invoker-iam-check"
      - "--set-env-vars"
      - "LLM_RETRIES=${_LLM_RETRIES},GEMINI_MODEL_NAME=${_GEMINI_MODEL_NAME},GCLOUD_PROJECT=${_GCLOUD_PROJECT}"
      - "--network=${_NETWORK}"
      - "--subnet=${_SUBNET}"
      - "--vpc-egress=private-ranges-only"

substitutions:
  # Injected by CI from GitHub environment vars/secrets. Sentinel = fail loudly if not injected.
  _SERVICE_NAME: "document-intelligence-service"
  _IMAGE_URI: ""
  _GCLOUD_PROJECT: "REQUIRED_INJECTED_AT_DEPLOY"
  _NETWORK: "REQUIRED_INJECTED_AT_DEPLOY"
  _SUBNET: "REQUIRED_INJECTED_AT_DEPLOY"
  # Non-sensitive config — kept as real defaults.
  _GCP_REGION: "europe-west10"
  _LLM_RETRIES: "3"
  _GEMINI_MODEL_NAME: "gemini-3.5-flash"

options:
  logging: CLOUD_LOGGING_ONLY
