[project]
name = "document-intelligence-service"
version = "0.2.0"
description = "Automated document classification and extraction for BeyondForms"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beyondforms-document-schemas",
    "fastapi[standard]~=0.162.0",
    "uvicorn~=0.54.0",
    "python-multipart~=0.0.33",
    "litellm~=1.108",
    "pydantic~=2.14",
    "pydantic-settings~=2.16",
    "python-dotenv~=1.2",
    "tenacity~=9.1",
    "litellm[google]~=1.108",
    "numpy~=2.5",
    "google-cloud-storage~=3.17",
]

[dependency-groups]
dev = [
    "pytest~=9.2",
    "pytest-asyncio~=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
beyondforms-document-schemas = { workspace = true }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "src/app"]
markers = [
    "e2e: End-to-end tests"
]

[tool.mypy]
mypy_path = "src"
# Ensure mypy follows imports correctly
explicit_package_bases = true
namespace_packages = true
# Ignore missing stubs for third-party libs like litellm
ignore_missing_imports = true
