[project]
name = "orchestration-middleware-service"
version = "0.1.0"
description = "The Middleware Orchestration API serves as the central hub for our document processing ecosystem. This service will act as the glue between our distributed internal services and the LLM."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]~=0.159.1",
    "google-cloud-aiplatform~=1.165",
    "litellm~=1.106",
    "google-cloud-storage~=3.17",
    "google-cloud-pubsub~=2.43",
    "psycopg2-binary~=2.9",
    "python-dotenv~=1.2",
    "sqlalchemy~=2.1",
    "beyondforms-auth",
    "beyondforms-document-schemas",
    "reportlab~=5.1",
    "sqlacodegen~=4.0",
    "pydantic~=2.14",
    "firebase-admin~=7.7",
    "httpx~=0.28.1",
    "pyjexl~=0.3.0",
    "aiofiles>=25.1.0",
    "pyjwt[crypto]~=2.15",
    "pyopenssl~=26.4",
    "Pillow~=13.0",
    "pillow-heif~=1.8",
    "ag-ui-protocol~=1.0",
    "json5~=0.17.3",
]

[tool.uv.sources]
beyondforms-auth = { workspace = true }
beyondforms-document-schemas = { workspace = true }

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true



[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest~=9.1",
    "pytest-asyncio~=1.4",
    "locust~=2.47",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
