steps:
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "${_SERVICE_NAME}"
      - "--image=${_IMAGE_URI}"
      - "--region=${_GCP_REGION}"
      - "--platform=managed"
      - "--set-env-vars"
      - &env_vars "ENDPOINT_RULES_ENGINE=${_ENDPOINT_RULES_ENGINE},ENDPOINT_FORMS_FILLER=${_ENDPOINT_FORMS_FILLER},GCS_BUCKET_NAME=${_GCS_BUCKET_NAME},POSTGRES_HOST=${_DB_HOST},POSTGRES_PORT=${_DB_PORT},POSTGRES_DATABASE=${_DB_NAME},OIDC_CLIENT_ID=${_OIDC_CLIENT_ID},AUTHENTIK_PUBLIC_KEY_PATH=${_AUTHENTIK_PUBLIC_KEY_PATH},GEMINI_MODEL_NAME=${_GEMINI_MODEL_NAME},CHAT_CONTEXT_WINDOW_SIZE=${_CHAT_CONTEXT_WINDOW_SIZE},GCLOUD_PROJECT=${_GCLOUD_PROJECT},ENDPOINT_DOC_INTELLIGENCE=${_ENDPOINT_DOC_INTELLIGENCE},PUBSUB_PROJECT_ID=${_PUBSUB_PROJECT_ID},PUBSUB_TOPIC_ID=${_PUBSUB_TOPIC_ID},PUBSUB_SUBSCRIPTION_ID=${_PUBSUB_SUBSCRIPTION_ID},PUBSUB_DLQ_TOPIC_ID=${_PUBSUB_DLQ_TOPIC_ID},MIDDLEWARE_SERVICE_URL=${_MIDDLEWARE_SERVICE_URL},RAG_ENGINE_CORPUS=${_RAG_ENGINE_CORPUS},GCP_RAG_ENGINE_REGION=${_GCP_RAG_ENGINE_REGION},AUTHENTIK_SERVER_URL=${_AUTHENTIK_SERVER_URL},AUTHENTIK_ISSUER_URL=${_AUTHENTIK_ISSUER_URL},DEMO_SEED_ENABLED=${_DEMO_SEED_ENABLED}"
      - "--set-secrets"
      - "POSTGRES_USER=${_DB_USER_SECRET}:latest,POSTGRES_PASSWORD=${_DB_PASSWORD_SECRET}:latest,OIDC_CLIENT_SECRET=BEYONDFORMS_OIDC_CLIENT_SECRET:latest,INTERNAL_API_KEY=INTERNAL_API_KEY:latest,/app/auth/certs/pub/oidc_public.pem=GOAUTHENTIK_KEY_PUB:latest"
      - "--no-invoker-iam-check"
      - "--network=${_NETWORK}"
      - "--subnet=${_SUBNET}"
      - "--vpc-egress=private-ranges-only"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "beta"
      - "run"
      - "worker-pools"
      - "deploy"
      - "${_SERVICE_NAME}"
      - "--command=python"
      - "--args=src/worker.py"
      - "--image=${_IMAGE_URI}"
      - "--region=${_GCP_REGION}"
      - "--set-env-vars"
      - *env_vars
      - "--set-secrets"
      - "POSTGRES_USER=${_DB_USER_SECRET}:latest,POSTGRES_PASSWORD=${_DB_PASSWORD_SECRET}:latest,OIDC_CLIENT_SECRET=BEYONDFORMS_OIDC_CLIENT_SECRET:latest,INTERNAL_API_KEY=INTERNAL_API_KEY:latest"
      - "--network=${_NETWORK}"
      - "--subnet=${_SUBNET}"
      - "--vpc-egress=private-ranges-only"

substitutions:
  # Injected by CI from GitHub environment vars/secrets. Sentinel = fail loudly if not injected.
  _SERVICE_NAME: "orchestration-middleware-service"
  _IMAGE_URI: ""
  _DB_HOST: "REQUIRED_INJECTED_AT_DEPLOY"
  _DB_NAME: "REQUIRED_INJECTED_AT_DEPLOY"
  _DB_USER_SECRET: "REQUIRED_INJECTED_AT_DEPLOY"
  _DB_PASSWORD_SECRET: "REQUIRED_INJECTED_AT_DEPLOY"
  _GCS_BUCKET_NAME: "REQUIRED_INJECTED_AT_DEPLOY"
  _ENDPOINT_RULES_ENGINE: "REQUIRED_INJECTED_AT_DEPLOY"
  _ENDPOINT_FORMS_FILLER: "REQUIRED_INJECTED_AT_DEPLOY"
  _ENDPOINT_DOC_INTELLIGENCE: "REQUIRED_INJECTED_AT_DEPLOY"
  _MIDDLEWARE_SERVICE_URL: "REQUIRED_INJECTED_AT_DEPLOY"
  _GCLOUD_PROJECT: "REQUIRED_INJECTED_AT_DEPLOY"
  _NETWORK: "REQUIRED_INJECTED_AT_DEPLOY"
  _SUBNET: "REQUIRED_INJECTED_AT_DEPLOY"
  _PUBSUB_PROJECT_ID: "REQUIRED_INJECTED_AT_DEPLOY"
  _PUBSUB_TOPIC_ID: "REQUIRED_INJECTED_AT_DEPLOY"
  _PUBSUB_SUBSCRIPTION_ID: "REQUIRED_INJECTED_AT_DEPLOY"
  _PUBSUB_DLQ_TOPIC_ID: "REQUIRED_INJECTED_AT_DEPLOY"
  _RAG_ENGINE_CORPUS: "REQUIRED_INJECTED_AT_DEPLOY"
  _AUTHENTIK_SERVER_URL: "REQUIRED_INJECTED_AT_DEPLOY"
  _AUTHENTIK_ISSUER_URL: "REQUIRED_INJECTED_AT_DEPLOY"
  # Non-sensitive config — same across staging/prod, kept as real defaults.
  _DB_PORT: "5432"
  _OIDC_CLIENT_ID: "beyondforms"
  _AUTHENTIK_PUBLIC_KEY_PATH: "/app/auth/certs/pub/oidc_public.pem"
  _GCP_REGION: "europe-west10"
  _GEMINI_MODEL_NAME: "gemini-3.7-flash"
  _CHAT_CONTEXT_WINDOW_SIZE: "20"
  _GCP_RAG_ENGINE_REGION: "europe-west3"

options:
  logging: CLOUD_LOGGING_ONLY
