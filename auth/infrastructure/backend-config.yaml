apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: authentik-backend-config
  namespace: default
spec:
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 15
    healthyThreshold: 1
    unhealthyThreshold: 2
    type: HTTP
    requestPath: /if/flow/default-authentication-flow/
    port: 9000
