# Authentik Blueprint: OIDC Provider and Application for BeyondForms
version: 1

entries:
  # Signing Key for OIDC
  - model: authentik_crypto.certificatekeypair
    identifiers:
      name: beyondforms-signing-key
    attrs:
      name: BeyondForms Signing Key
      certificate_data: !File /certs/pub/oidc_public.pem
      key_data: !File /certs/priv/oidc_private.pem

  # OIDC Provider
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: beyondforms-provider
    attrs:
      name: BeyondForms Provider
      client_id: beyondforms
      client_secret: !Env BEYONDFORMS_OIDC_CLIENT_SECRET
      # !KeyOf's __repr__ crashes with a misleading "failed to find entry"
      # error if any log gets emitted while this value is still unresolved
      # (see authentik.blueprints.v1.common.YAMLTag.__repr__). !Find does a
      # live DB lookup instead and degrades to None on a miss, so it can't
      # trigger that crash.
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, beyondforms-signing-key]]
      authentication_flow:
        !Find [authentik_flows.flow, [slug, passwordless-sms-login]]
      redirect_uris:
        - matching_mode: strict
          url: "http://localhost:3000/api/auth/callback/beyondforms"
        - matching_mode: strict
          url: "http://localhost:3000/auth/callback"
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-implicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      property_mappings:
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-openid],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-profile],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-email],
          ]

  # Application
  - model: authentik_core.application
    identifiers:
      slug: beyondforms
    attrs:
      name: BeyondForms
      slug: beyondforms
      provider:
        !Find [authentik_providers_oauth2.oauth2provider, [name, beyondforms-provider]]
