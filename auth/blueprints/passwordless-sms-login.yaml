# Authentik Blueprint: Passwordless SMS-only Authentication
# This blueprint creates a flow where the user enters their phone number,
# receives an SMS code, and is logged in.
version: 1

entries:
  - model: authentik_flows.flow
    identifiers:
      slug: passwordless-sms-login
    id: flow
    attrs:
      name: Passwordless SMS Login
      title: "Login with Phone"
      designation: authentication
      compatibility_mode: false

  # Identification Stage: Asks for the phone number
  - model: authentik_stages_identification.identificationstage
    identifiers:
      name: passwordless-sms-login-identification-stage
    id: identification-stage
    attrs:
      user_fields:
        - username
      label_text: "Phone Number"
      placeholder_text: "+1234567890"
      case_insensitive_matching: true
      show_matched_user: true
      pretend_user_exists: false
      # No password_stage defined here makes it passwordless

  # SMS Authenticator Stage: Sends the code
  - model: authentik_stages_authenticator_sms.authenticatorsmsstage
    identifiers:
      name: passwordless-sms-login-sms-stage
    id: sms-stage
    attrs:
      configure_flow: null # Users don't "configure" this during login
      verify_only_and_not_create: true # Essential for login-only flows
      provider: twilio
      from_number: !Env AUTHENTIK_SMS__PROVIDERS__TWILIO__FROM
      account_sid: !Env AUTHENTIK_SMS__PROVIDERS__TWILIO__ACCOUNT_SID
      auth: !Env AUTHENTIK_SMS__PROVIDERS__TWILIO__AUTH_TOKEN

  # Login Stage: Creates the session
  - model: authentik_stages_user_login.userloginstage
    identifiers:
      name: passwordless-sms-login-login-stage
    id: login-stage
    attrs:
      session_duration: "hours=24"

  # Bindings
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      stage: !KeyOf identification-stage
      order: 10
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      stage: !KeyOf sms-stage
      order: 20
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      stage: !KeyOf login-stage
      order: 30
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true
