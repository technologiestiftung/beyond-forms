# Authentik Blueprint: Username-Password Enrollment Flow
#
# This blueprint defines a two-stage enrollment flow used for test accounts.
# It allows the 'start' endpoint to handle identification (Username stage)
# and the 'finish' endpoint to handle authentication (Password stage),
# effectively sidestepping the default SMS-based flow.
version: 1

entries:
  - model: authentik_flows.flow
    identifiers:
      slug: username-password-enrollment
    id: flow
    attrs:
      name: Username-Password Enrollment Flow
      title: Welcome to authentik!
      designation: enrollment
      authentication: require_unauthenticated
      compatibility_mode: false

  # Username
  - model: authentik_stages_prompt.prompt
    identifiers:
      name: username-password-enrollment-prompt-username
    id: prompt-username
    attrs:
      field_key: username
      label: Username
      type: text
      required: true
      order: 10

  - model: authentik_stages_prompt.promptstage
    identifiers:
      name: username-password-enrollment-prompt-stage-username
    id: prompt-stage-username
    attrs:
      fields:
        - !KeyOf prompt-username

  # Password
  - model: authentik_stages_prompt.prompt
    identifiers:
      name: username-password-enrollment-prompt-password
    id: prompt-password
    attrs:
      field_key: password
      label: Password
      type: password
      required: true
      order: 20

  - model: authentik_stages_prompt.promptstage
    identifiers:
      name: username-password-enrollment-prompt-stage-password
    id: prompt-stage-password
    attrs:
      fields:
        - !KeyOf prompt-password

  # User Write Stage: Creates the user in the database
  - identifiers:
      name: username-password-enrollment-user-write
    id: user-write
    model: authentik_stages_user_write.userwritestage
    attrs:
      user_creation_mode: always_create

  # Login Stage: Creates the session after enrollment
  - identifiers:
      name: username-password-enrollment-user-login
    id: user-login
    model: authentik_stages_user_login.userloginstage
    attrs:
      session_duration: "hours=24"

  # Bindings
  - identifiers:
      target: !KeyOf flow
      stage: !KeyOf prompt-stage-username
      order: 10
    model: authentik_flows.flowstagebinding
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true

  - identifiers:
      target: !KeyOf flow
      stage: !KeyOf prompt-stage-password
      order: 20
    model: authentik_flows.flowstagebinding
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true

  - identifiers:
      target: !KeyOf flow
      stage: !KeyOf user-write
      order: 30
    model: authentik_flows.flowstagebinding
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true

  - identifiers:
      target: !KeyOf flow
      stage: !KeyOf user-login
      order: 40
    model: authentik_flows.flowstagebinding
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true
