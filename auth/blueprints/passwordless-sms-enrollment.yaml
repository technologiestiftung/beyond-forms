# Authentik Blueprint: Passwordless SMS Enrollment
# This blueprint creates an enrollment flow where a new user provides their phone number,
# verifies it via SMS, and is registered and logged in.
version: 1

entries:
  - model: authentik_flows.flow
    identifiers:
      slug: passwordless-sms-enrollment
    id: flow
    attrs:
      name: Passwordless SMS Enrollment
      title: "Enroll with Phone"
      designation: enrollment
      compatibility_mode: false

  # Prompt for Phone Number (as username and phone_number)
  - model: authentik_stages_prompt.prompt
    identifiers:
      name: passwordless-sms-enrollment-prompt-username
    id: prompt-username
    attrs:
      field_key: username
      label: "Username"
      type: text
      placeholder: "+1234567890"
      order: 10

  - model: authentik_stages_prompt.prompt
    identifiers:
      name: passwordless-sms-enrollment-prompt-phone-number
    id: prompt-phone-number
    attrs:
      field_key: phone_number
      label: "Phone Number"
      type: text
      placeholder: "+1234567890"
      order: 20

  - model: authentik_stages_prompt.promptstage
    identifiers:
      name: passwordless-sms-enrollment-prompt-stage
    id: prompt-stage
    attrs:
      fields:
        - !KeyOf prompt-username
        - !KeyOf prompt-phone-number

  # User Write Stage: Creates the user in the database
  - model: authentik_stages_user_write.userwritestage
    identifiers:
      name: passwordless-sms-enrollment-user-write
    id: user-write
    attrs:
      user_creation_mode: always_create

  # SMS Authenticator Stage: Sends and verifies the code
  - model: authentik_stages_authenticator_sms.authenticatorsmsstage
    identifiers:
      name: passwordless-sms-enrollment-sms-stage
    id: sms-stage
    attrs:
      verify_only_and_not_create: false
      provider: twilio
      from_number: !Env AUTHENTIK_SMS__PROVIDERS__TWILIO__FROM
      account_sid: !Env AUTHENTIK_SMS__PROVIDERS__TWILIO__ACCOUNT_SID
      auth: !Env AUTHENTIK_SMS__PROVIDERS__TWILIO__AUTH_TOKEN

  # Login Stage: Creates the session after enrollment
  - model: authentik_stages_user_login.userloginstage
    identifiers:
      name: passwordless-sms-enrollment-login-stage
    id: login-stage
    attrs:
      session_duration: "hours=24"

  # Bindings
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      stage: !KeyOf prompt-stage
      order: 10
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      stage: !KeyOf user-write
      order: 20
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      stage: !KeyOf sms-stage
      order: 30
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow
      stage: !KeyOf login-stage
      order: 40
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true
